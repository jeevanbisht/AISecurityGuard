name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            ai_model_service/requirements.txt
            webserver/requirements.txt
            reference_filter/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r ai_model_service/requirements.txt
          python -m pip install -r webserver/requirements.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test AI guard
        working-directory: ai_model_service
        run: python -m unittest discover
      - name: Test reference filter
        working-directory: reference_filter
        run: python -m unittest discover
      - name: Validate Docker Compose
        run: |
          python generate_certs.py
          docker compose config --quiet

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit runtime dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          pip-audit -r ai_model_service/requirements.txt
          pip-audit -r webserver/requirements.txt
          pip-audit -r reference_filter/requirements.txt

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build service images
        run: docker compose build
